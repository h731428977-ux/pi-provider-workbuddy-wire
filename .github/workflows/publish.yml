name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Verify release candidate
        run: npm run verify

      - name: Verify package version matches tag
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag (${GITHUB_REF_NAME})"
            exit 1
          fi

      - name: Pack release artifacts
        run: |
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
          cd release
          sha256sum *.tgz > SHA256SUMS

      - name: Publish npm package
        run: npm publish release/*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.tgz release/SHA256SUMS \
            --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ github.ref_name }}
          path: |
            dist/
            release/
          retention-days: 30
